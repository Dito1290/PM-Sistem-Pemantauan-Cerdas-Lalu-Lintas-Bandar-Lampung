[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: needs a real Redis server (TEST_REDIS_URL=redis://...) and starts a Celery worker
    opencv: exercises the real OpenCV capture/encode path with local generated video
filterwarnings =
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*
